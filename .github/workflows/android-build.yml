name: Android Build & Release CI/CD

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Android Release APK & AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon || true

      - name: Find and Stage Artifacts
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} artifacts/GT-pro-debug.apk \; 2>/dev/null || true
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} artifacts/GT-pro-release.apk \; 2>/dev/null || true
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} artifacts/GT-pro-release.aab \; 2>/dev/null || true
          ls -la artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT-pro-debug-apk
          path: artifacts/GT-pro-debug.apk
          retention-days: 14

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GT-pro-release-bundle
          path: artifacts/
          retention-days: 30

      - name: Publish GitHub Release on Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            artifacts/GT-pro-debug.apk
            artifacts/GT-pro-release.apk
            artifacts/GT-pro-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
